<nav class="gm-pagination" [attr.aria-label]="ariaLabel()">
  @if (showCurrentPageReport()) {
    <!-- Announced on change so screen-reader users hear the new range. -->
    <span class="gm-pagination__report" aria-live="polite">{{ report() }}</span>
  }

  <!-- Pages and the size selector read as one strip of boxed controls, so they
       share a wrapper rather than sitting at opposite ends of the nav. -->
  <div class="gm-pagination__controls">
    <ul class="gm-pagination__list">
      <li>
        <button
          type="button"
          class="gm-pagination__nav"
          aria-label="First page"
          [disabled]="navDisabled() || isFirstPage()"
          (click)="goTo(1)"
        >
          <svg
            class="gm-pagination__chevron"
            viewBox="0 0 16 16"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M12.5 3.5 8 8l4.5 4.5M8 3.5 3.5 8 8 12.5" />
          </svg>
        </button>
      </li>
      <li>
        <button
          type="button"
          class="gm-pagination__nav"
          aria-label="Previous page"
          [disabled]="navDisabled() || isFirstPage()"
          (click)="goTo(currentPage() - 1)"
        >
          <svg
            class="gm-pagination__chevron"
            viewBox="0 0 16 16"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M10.25 3.5 5.75 8l4.5 4.5" />
          </svg>
        </button>
      </li>

      @for (slot of slots(); track $index) {
        <li>
          @if (slot === 'ellipsis') {
            <!-- Presentational: a gap is not a control. -->
            <span class="gm-pagination__gap" aria-hidden="true">…</span>
          } @else {
            <button
              type="button"
              class="gm-pagination__page"
              [class.gm-pagination__page--current]="slot === currentPage()"
              [attr.aria-label]="'Page ' + slot"
              [attr.aria-current]="slot === currentPage() ? 'page' : null"
              [disabled]="disabled()"
              (click)="goTo(slot)"
            >
              {{ slot }}
            </button>
          }
        </li>
      }

      <li>
        <button
          type="button"
          class="gm-pagination__nav"
          aria-label="Next page"
          [disabled]="navDisabled() || isLastPage()"
          (click)="goTo(currentPage() + 1)"
        >
          <svg
            class="gm-pagination__chevron"
            viewBox="0 0 16 16"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M5.75 3.5 10.25 8l-4.5 4.5" />
          </svg>
        </button>
      </li>
      <li>
        <button
          type="button"
          class="gm-pagination__nav"
          aria-label="Last page"
          [disabled]="navDisabled() || isLastPage()"
          (click)="goTo(totalPages())"
        >
          <svg
            class="gm-pagination__chevron"
            viewBox="0 0 16 16"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M3.5 3.5 8 8l-4.5 4.5M8 3.5 12.5 8 8 12.5" />
          </svg>
        </button>
      </li>
    </ul>

    @if (pageSizeOptions().length) {
      <div class="gm-pagination__size">
        <!-- gm-select is a ControlValueAccessor, so a standalone ngModel is how
             its value is driven without a parent form. -->
        <gm-select
          [inputId]="pageSizeId"
          [ariaLabel]="pageSizeLabel()"
          [options]="pageSizeOptions()"
          [ngModel]="pageSize()"
          [ngModelOptions]="{ standalone: true }"
          [disabled]="disabled()"
          (valueChange)="onPageSizeChange($event)"
          size="small"
        />
      </div>
    }
  </div>
</nav>
