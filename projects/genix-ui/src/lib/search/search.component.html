<div class="gm-field">
  @if (label()) {
    <label class="gm-field__label" [attr.for]="controlId()">
      {{ label() }}
      @if (required()) {
        <span class="gm-field__required" aria-hidden="true">*</span>
      }
    </label>
  }

  <div class="gm-search">
    <i
      class="gm-search__icon gm-search__icon--start"
      [class]="icon()"
      aria-hidden="true"
    ></i>

    <input
      type="text"
      class="gm-field__control"
      [attr.id]="controlId()"
      [attr.name]="name()"
      [value]="value() ?? ''"
      [disabled]="isDisabled()"
      [attr.readonly]="readOnly() ? '' : null"
      [attr.placeholder]="placeholder()"
      [attr.aria-label]="ariaLabel()"
      [attr.aria-invalid]="hasError() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      (input)="handleInput($event)"
      (blur)="handleBlur()"
    />

    <span class="gm-search__actions">
      @if (busy()) {
        <span
          class="gm-search__spinner"
          role="status"
          [attr.aria-label]="loadingLabel()"
        ></span>
      } @else if (clearable() && isFilled() && !readOnly()) {
        <!-- A real button so it is reachable and announced on its own. -->
        <button
          type="button"
          class="gm-search__clear"
          aria-label="Clear search"
          [disabled]="isDisabled()"
          (click)="clear()"
        >
          <span class="gm-search__clear-icon" aria-hidden="true"></span>
        </button>
      }
    </span>
  </div>

  @if (!hideMessageRow()) {
    <small
      class="gm-field__message"
      [class.gm-field__error]="!!errorText()"
      [class.gm-field__hint]="!errorText() && showHint()"
      [attr.id]="messageElementId()"
      [attr.role]="errorText() ? 'alert' : null"
    >
      {{ messageText() }}
    </small>
  }
</div>
