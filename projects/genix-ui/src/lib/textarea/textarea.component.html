<div class="gm-field">
  @if (label()) {
    <label class="gm-field__label" [attr.for]="controlId()">
      {{ label() }}
      @if (required()) {
        <span class="gm-field__required" aria-hidden="true">*</span>
      }
    </label>
  }

  <textarea
    class="gm-field__control"
    [attr.id]="controlId()"
    [attr.name]="name()"
    [rows]="rows()"
    [value]="value() ?? ''"
    [disabled]="isDisabled()"
    [style.resize]="resize()"
    [attr.readonly]="readOnly() ? '' : null"
    [attr.placeholder]="placeholder()"
    [attr.maxlength]="maxLength() ?? null"
    [attr.minlength]="minLength() ?? null"
    [attr.required]="required() ? '' : null"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-invalid]="hasError() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
  ></textarea>

  @if (errorText()) {
    <small class="gm-field__error" [attr.id]="errorElementId()" role="alert">
      {{ errorText() }}
    </small>
  } @else if (showHint()) {
    <small class="gm-field__hint" [attr.id]="hintElementId()">
      {{ hint() }}
    </small>
  }
</div>
